<head>
  <title>Ambiente da Tela</title>
  <meta description="Os LEDs acompanham o que aparece no monitor: cada luz copia a cor da região da tela que fica na mesma posição. Também pode seguir a música do PC: as cores, o brilho e o movimento mudam com a emoção da música (tristeza ou alegria, calma ou agressividade)." />
  <meta publisher="Hydraflow" />
  <!-- o app reconhece esta linha e captura a tela em vez de rodar o canvas abaixo (que só serve de prévia) -->
  <meta screen-capture="true" />
  <meta property="detail" label="Detalhe" type="combobox" values="Uma cor só,Baixo,Médio,Alto" default="Médio" />
  <meta property="saturation" label="Saturação" type="number" min="0" max="250" default="130" />
  <meta property="brightness" label="Brilho" type="number" min="20" max="250" default="110" />
  <meta property="smoothing" label="Suavização" type="number" min="0" max="95" default="35" />
  <meta property="react" label="Reagir ao som" type="combobox" values="Nenhuma,Som do PC" default="Nenhuma" />
  <meta property="reactBrightness" label="Brilho" type="number" min="5" max="100" default="100" />
  <meta property="pulseIntensity" label="Intensidade do pulso" type="number" min="0" max="100" default="50" />
  <meta property="biasValence" label="Calibrar Triste ↔ Alegre" type="number" min="-50" max="50" default="0" />
  <meta property="biasEnergy" label="Calibrar Calmo ↔ Raiva" type="number" min="-50" max="50" default="0" />
</head>
<body style="margin:0;background:#000"><canvas id="exCanvas" width="320" height="200"></canvas></body>
<script>
  // prévia: um "monitor" com uma cena que muda de cor e um clarão de vez em quando
  const ctx = document.getElementById("exCanvas").getContext("2d");
  const W = 320, H = 200;
  let t = 0;
  function frame() {
    t += 0.016;
    const h = (t * 25) % 360;
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, `hsl(${h},90%,45%)`); g.addColorStop(1, `hsl(${(h + 140) % 360},90%,35%)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const flash = Math.max(0, Math.sin(t * 1.3) - 0.85) * 6;
    if (flash > 0) { ctx.globalAlpha = Math.min(1, flash); ctx.fillStyle = "#fff4d6"; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
    ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.fillRect(70, 45, 180, 110);
    ctx.strokeStyle = "rgba(255,255,255,0.85)"; ctx.lineWidth = 3; ctx.strokeRect(70, 45, 180, 110);
    ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.fillRect(150, 155, 20, 14); ctx.fillRect(130, 169, 60, 4);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
