<head>
  <title>Correnteza</title>
  <meta description="Correntes de água em camadas se cruzam com espuma brilhante, como o mar puxando para dentro." />
  <meta publisher="Hydraflow" />
  <meta property="color" label="Cor da água" type="color" default="#0077ff" />
  <meta property="foam" label="Cor da espuma" type="color" default="#bff6ff" />
  <meta property="speed" label="Velocidade" type="number" min="1" max="100" default="45" />
  <meta property="turbulence" label="Agitação" type="number" min="0" max="100" default="55" />
</head>
<body style="margin:0;background:#000"><canvas id="exCanvas" width="320" height="200"></canvas></body>
<script>
  const ctx = document.getElementById("exCanvas").getContext("2d");
  const W = 320, H = 200;
  let t = 0;
  function rgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
  function frame() {
    t += speed / 1500;
    const [r, g, b] = rgb(color), [fr, fg, fb] = rgb(foam);
    const k = turbulence / 100;
    ctx.fillStyle = `rgb(${r * 0.12},${g * 0.12},${b * 0.12})`;
    ctx.fillRect(0, 0, W, H);
    // camadas de onda: as de trás são mais escuras e lentas, as da frente correm na direção oposta
    for (let layer = 0; layer < 6; layer++) {
      const depth = layer / 5;
      const dir = layer % 2 ? -1 : 1;
      const base = 20 + layer * 32;
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 4) {
        const y = base + Math.sin(x * 0.03 + t * 3 * dir * (1 + depth)) * (8 + 14 * k)
          + Math.sin(x * 0.071 - t * 5 * dir) * 6 * k;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H); ctx.closePath();
      const m = 0.25 + depth * 0.75;
      ctx.fillStyle = `rgba(${r * m},${g * m},${b * m},0.55)`;
      ctx.fill();
      // espuma na crista
      ctx.strokeStyle = `rgba(${fr},${fg},${fb},${0.15 + depth * 0.45 * (0.5 + k / 2)})`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
