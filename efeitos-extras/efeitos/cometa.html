<head>
  <title>Cometa</title>
  <meta description="Um cometa brilhante cruza o setup deixando uma cauda de cor." />
  <meta publisher="Hydraflow" />
  <meta property="color" label="Cor" type="color" default="#ffb000" />
  <meta property="rainbowTail" label="Cauda arco-íris" type="boolean" default="0" />
  <meta property="speed" label="Velocidade" type="number" min="1" max="100" default="45" />
  <meta property="tail" label="Comprimento da cauda" type="number" min="5" max="95" default="80" />
  <meta property="path" label="Trajetória" type="combobox" values="Horizontal,Vertical,Circular,Infinito" default="Circular" />
</head>
<body style="margin:0;background:#000"><canvas id="exCanvas" width="320" height="200"></canvas></body>
<script>
  const ctx = document.getElementById("exCanvas").getContext("2d");
  let t = 0;
  function pos() {
    if (path === "Horizontal") return [((t * 60) % 400) - 40, 100];
    if (path === "Vertical") return [160, ((t * 40) % 280) - 40];
    if (path === "Infinito") return [160 + Math.sin(t) * 130, 100 + Math.sin(t * 2) * 70];
    return [160 + Math.cos(t) * 130, 100 + Math.sin(t) * 80];
  }
  function frame() {
    t += speed / 1500;
    ctx.globalAlpha = 1 - tail / 100; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 320, 200);
    ctx.globalAlpha = 1;
    const [x, y] = pos();
    const c = rainbowTail ? `hsl(${(t * 80) % 360},100%,55%)` : color;
    const g = ctx.createRadialGradient(x, y, 0, x, y, 30);
    g.addColorStop(0, "#fff"); g.addColorStop(0.3, c); g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g; ctx.fillRect(x - 30, y - 30, 60, 60);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
