<head>
  <title>Respingos</title>
  <meta description="Respingos de tinta colorida aparecem pelo setup com gotinhas em volta e vão desbotando aos poucos." />
  <meta publisher="Hydraflow" />
  <meta property="rate" label="Frequência" type="number" min="1" max="100" default="35" />
  <meta property="fadeOut" label="Desbotar" type="number" min="1" max="100" default="25" />
  <meta property="palette" label="Paleta" type="combobox" values="Arco-íris,Neon,Quente,Fria" default="Neon" />
</head>
<body style="margin:0;background:#000"><canvas id="exCanvas" width="320" height="200"></canvas></body>
<script>
  const ctx = document.getElementById("exCanvas").getContext("2d");
  const W = 320, H = 200;
  const PALS = { "Neon": [310, 190, 95, 50], "Quente": [0, 20, 40, 330], "Fria": [180, 210, 240, 270] };
  let splats = [];
  function pickHue() {
    const p = PALS[palette];
    return p ? p[Math.floor(Math.random() * p.length)] + (Math.random() - 0.5) * 16 : Math.random() * 360;
  }
  function splat() {
    const x = Math.random() * W, y = Math.random() * H, r = 14 + Math.random() * 26, hue = pickHue();
    const drops = Array.from({ length: 8 + Math.floor(Math.random() * 10) }, () => {
      const a = Math.random() * Math.PI * 2, d = r * (1 + Math.random() * 1.2);
      return [Math.cos(a) * d, Math.sin(a) * d, 1.5 + Math.random() * 4];
    });
    const blob = Array.from({ length: 14 }, () => 0.75 + Math.random() * 0.4); // borda irregular
    splats.push({ x, y, r, hue, drops, blob, life: 1, grow: 0 });
  }
  function frame() {
    if (Math.random() < rate / 900) splat();
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
    for (const s of splats) {
      s.grow = Math.min(1, s.grow + 0.12);
      s.life -= fadeOut / 40000;
      ctx.fillStyle = `hsla(${s.hue},100%,55%,${Math.max(0, s.life)})`;
      ctx.beginPath();
      s.blob.forEach((k, i) => {
        const a = i / s.blob.length * Math.PI * 2, rr = s.r * k * s.grow;
        const px = s.x + Math.cos(a) * rr, py = s.y + Math.sin(a) * rr;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      });
      ctx.closePath(); ctx.fill();
      for (const [dx, dy, dr] of s.drops) { ctx.beginPath(); ctx.arc(s.x + dx * s.grow, s.y + dy * s.grow, dr, 0, Math.PI * 2); ctx.fill(); }
    }
    splats = splats.filter(s => s.life > 0);
    requestAnimationFrame(frame);
  }
  splat(); splat();
  requestAnimationFrame(frame);
</script>
