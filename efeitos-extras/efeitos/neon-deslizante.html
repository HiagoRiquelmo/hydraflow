<head>
  <title>Neon Deslizante</title>
  <meta description="Faixas de neon atravessam o setup em sequência, cada uma num tom do arco-íris." />
  <meta publisher="Hydraflow" />
  <meta property="bars" label="Faixas" type="number" min="1" max="8" default="3" />
  <meta property="width" label="Largura" type="number" min="5" max="100" default="35" />
  <meta property="saturation" label="Saturação" type="number" min="0" max="100" default="100" />
  <meta property="vertical" label="Vertical" type="boolean" default="false" />
  <meta property="speed" label="Velocidade" type="number" min="1" max="100" default="45" />
</head>
<body style="margin:0;background:#000"><canvas id="exCanvas" width="320" height="200"></canvas></body>
<script>
  const ctx = document.getElementById("exCanvas").getContext("2d");
  const W = 320, H = 200;
  let t = 0;
  function frame() {
    t += speed / 4000;
    ctx.globalAlpha = 0.25; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H); // rastro curto
    ctx.globalAlpha = 1;
    const len = vertical ? H : W, bw = width;
    for (let i = 0; i < bars; i++) {
      const pos = ((t + i / bars) % 1) * (len + bw * 2) - bw;
      const hue = (t * 120 + i * 360 / bars) % 360;
      const g = vertical ? ctx.createLinearGradient(0, pos - bw, 0, pos + bw) : ctx.createLinearGradient(pos - bw, 0, pos + bw, 0);
      g.addColorStop(0, `hsla(${hue},${saturation}%,50%,0)`);
      g.addColorStop(0.5, `hsla(${hue},${saturation}%,${60 - saturation / 10}%,1)`);
      g.addColorStop(1, `hsla(${hue},${saturation}%,50%,0)`);
      ctx.fillStyle = g;
      if (vertical) ctx.fillRect(0, pos - bw, W, bw * 2); else ctx.fillRect(pos - bw, 0, bw * 2, H);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
