<head>
  <title>Enxame</title>
  <meta description="Dezenas de pontos de luz voam juntos como um enxame, seguindo um líder que passeia pelo setup." />
  <meta publisher="Hydraflow" />
  <meta property="color" label="Cor" type="color" default="#36c3ff" />
  <meta property="rainbow" label="Arco-íris" type="boolean" default="1" />
  <meta property="count" label="Quantidade" type="number" min="5" max="120" default="50" />
  <meta property="speed" label="Velocidade" type="number" min="1" max="100" default="45" />
  <meta property="trail" label="Rastro" type="number" min="0" max="95" default="75" />
</head>
<body style="margin:0;background:#000"><canvas id="exCanvas" width="320" height="200"></canvas></body>
<script>
  const ctx = document.getElementById("exCanvas").getContext("2d");
  const W = 320, H = 200;
  let t = 0, bees = [];
  function spawn(n) {
    // cada abelha mira um ponto próprio em volta do líder: o enxame fica espalhado em vez de virar um bolo
    while (bees.length < n) bees.push({ x: Math.random() * W, y: Math.random() * H, vx: 0, vy: 0, h: Math.random() * 360, k: 0.6 + Math.random() * 0.8,
      ox: (Math.random() - 0.5) * 140, oy: (Math.random() - 0.5) * 90, ph: Math.random() * 6.28 });
    bees.length = n;
  }
  function frame() {
    spawn(count);
    const s = speed / 50;
    t += 0.01 * s;
    // o líder faz uma curva de Lissajous: o enxame percorre todo o canvas
    const lx = W / 2 + Math.sin(t * 1.3) * W * 0.4 + Math.sin(t * 3.1) * 20;
    const ly = H / 2 + Math.sin(t * 1.9 + 1) * H * 0.38;
    ctx.fillStyle = `rgba(0,0,0,${1 - trail / 100})`;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";
    for (const b of bees) {
      const tx = lx + b.ox * Math.cos(t * 2 + b.ph), ty = ly + b.oy * Math.sin(t * 2.3 + b.ph);
      b.vx += ((tx - b.x) * 0.004 + (Math.random() - 0.5) * 0.6) * b.k * s;
      b.vy += ((ty - b.y) * 0.004 + (Math.random() - 0.5) * 0.6) * b.k * s;
      b.vx *= 0.93; b.vy *= 0.93;
      b.x += b.vx * s; b.y += b.vy * s;
      const c = rainbow ? `hsla(${(b.h + t * 60) % 360},100%,60%,1)` : color;
      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 7);
      g.addColorStop(0, "rgba(255,255,255,0.9)");
      g.addColorStop(0.35, c);
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.fillRect(b.x - 7, b.y - 7, 14, 14);
    }
    ctx.globalCompositeOperation = "source-over";
    requestAnimationFrame(frame);
  }
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  requestAnimationFrame(frame);
</script>
