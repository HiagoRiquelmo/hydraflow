<head>
  <title>Lâmpada de Lava</title>
  <meta description="Bolhas quentes que sobem, se unem e descem lentamente." />
  <meta publisher="Hydraflow" />
  <meta property="blob" label="Cor das bolhas" type="color" default="#ff3d00" />
  <meta property="background" label="Fundo" type="color" default="#2b0040" />
  <meta property="speed" label="Velocidade" type="number" min="1" max="100" default="25" />
  <meta property="count" label="Bolhas" type="number" min="2" max="12" default="6" />
</head>
<body style="margin:0;background:#000"><canvas id="exCanvas" width="320" height="200"></canvas></body>
<script>
  const ctx = document.getElementById("exCanvas").getContext("2d");
  const W = 80, H = 50, off = new OffscreenCanvas(W, H), o = off.getContext("2d"), img = o.createImageData(W, H);
  let t = 0;
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  function frame() {
    t += speed / 3000;
    const a = hex(background), b = hex(blob);
    const bs = Array.from({ length: count }, (_, k) => [W / 2 + Math.sin(t * (0.7 + k * 0.13) + k) * W * 0.4, H / 2 + Math.sin(t * (0.5 + k * 0.11) + k * 2) * H * 0.45, 7 + (k % 3) * 2]);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let v = 0; for (const [bx, by, r] of bs) v += r * r / ((x - bx) ** 2 + (y - by) ** 2 + 1);
      const k = Math.min(1, Math.max(0, (v - 0.8) * 1.5));
      const i = (y * W + x) * 4;
      for (let c = 0; c < 3; c++) img.data[i + c] = a[c] + (b[c] - a[c]) * k;
      img.data[i + 3] = 255;
    }
    o.putImageData(img, 0, 0); ctx.drawImage(off, 0, 0, 320, 200);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
