<head>
  <title>Sonar</title>
  <meta description="Um feixe de radar gira a partir do centro deixando um rastro que se apaga, revelando pontos pelo caminho." />
  <meta publisher="Hydraflow" />
  <meta property="color" label="Cor do feixe" type="color" default="#00ff88" />
  <meta property="speed" label="Velocidade" type="number" min="1" max="100" default="40" />
  <meta property="trail" label="Rastro" type="number" min="5" max="95" default="70" />
  <meta property="rings" label="Anéis" type="boolean" default="1" />
  <meta property="blips" label="Pontos detectados" type="number" min="0" max="30" default="10" />
</head>
<body style="margin:0;background:#000"><canvas id="exCanvas" width="320" height="200"></canvas></body>
<script>
  const ctx = document.getElementById("exCanvas").getContext("2d");
  const W = 320, H = 200, CX = W / 2, CY = H / 2, R = Math.hypot(CX, CY);
  let a = 0;
  let points = [];
  function rgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
  function makePoints() {
    points = Array.from({ length: blips }, () => ({ ang: Math.random() * Math.PI * 2, dist: 20 + Math.random() * (R - 30), life: 0 }));
  }
  function frame() {
    if (points.length !== blips) makePoints();
    const prev = a;
    a = (a + speed / 900) % (Math.PI * 2);
    const [r, g, b] = rgb(color);
    ctx.fillStyle = `rgba(0,0,0,${1 - trail / 100})`;
    ctx.fillRect(0, 0, W, H);
    // feixe: um leque estreito com degradê do centro para fora
    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(a);
    const grad = ctx.createLinearGradient(0, 0, R, 0);
    grad.addColorStop(0, `rgba(${r},${g},${b},0.95)`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0.35)`);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, -0.09, 0.02); ctx.closePath(); ctx.fill();
    ctx.restore();
    if (rings) {
      ctx.strokeStyle = `rgba(${r},${g},${b},0.18)`; ctx.lineWidth = 1;
      for (let k = 1; k <= 4; k++) { ctx.beginPath(); ctx.arc(CX, CY, k * R / 4.4, 0, Math.PI * 2); ctx.stroke(); }
    }
    // pontos acendem quando o feixe passa por eles e vão apagando
    for (const p of points) {
      const passed = prev <= a ? (p.ang > prev && p.ang <= a) : (p.ang > prev || p.ang <= a);
      if (passed) p.life = 1;
      if (p.life > 0) {
        const x = CX + Math.cos(p.ang) * p.dist, y = CY + Math.sin(p.ang) * p.dist;
        const glow = ctx.createRadialGradient(x, y, 0, x, y, 9);
        glow.addColorStop(0, `rgba(255,255,255,${p.life})`);
        glow.addColorStop(0.4, `rgba(${r},${g},${b},${p.life})`);
        glow.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = glow; ctx.fillRect(x - 9, y - 9, 18, 18);
        p.life -= 0.012;
        if (p.life <= 0) { p.ang = Math.random() * Math.PI * 2; p.dist = 20 + Math.random() * (R - 30); }
      }
    }
    requestAnimationFrame(frame);
  }
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  requestAnimationFrame(frame);
</script>
