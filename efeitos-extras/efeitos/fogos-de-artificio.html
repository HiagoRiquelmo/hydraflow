<head>
  <title>Fogos de Artifício</title>
  <meta description="Foguetes sobem e explodem em chuvas de faíscas coloridas que caem devagar." />
  <meta publisher="Hydraflow" />
  <meta property="rate" label="Frequência" type="number" min="1" max="100" default="40" />
  <meta property="size" label="Tamanho da explosão" type="number" min="10" max="100" default="60" />
  <meta property="rainbow" label="Cores variadas" type="boolean" default="1" />
  <meta property="color" label="Cor (se não variadas)" type="color" default="#ffcc33" />
</head>
<body style="margin:0;background:#000"><canvas id="exCanvas" width="320" height="200"></canvas></body>
<script>
  const ctx = document.getElementById("exCanvas").getContext("2d");
  const W = 320, H = 200;
  let rockets = [], sparks = [];
  function launch() {
    rockets.push({ x: 30 + Math.random() * (W - 60), y: H, vy: -(3.2 + Math.random() * 1.6), hue: Math.random() * 360, fuse: 30 + Math.random() * 25 });
  }
  function burst(r) {
    const n = 30 + size * 0.7, pow = 0.8 + size / 50;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = Math.random() * pow + 0.4;
      sparks.push({ x: r.x, y: r.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, hue: r.hue + (Math.random() - 0.5) * 30 });
    }
  }
  function frame() {
    if (Math.random() < rate / 1800) launch();
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";
    for (const r of rockets) {
      r.y += r.vy; r.vy += 0.03; r.fuse--;
      ctx.fillStyle = "rgba(255,230,180,0.9)"; ctx.fillRect(r.x - 1, r.y - 1, 2, 4);
      if (r.fuse <= 0 || r.vy >= -0.4) { burst(r); r.dead = true; }
    }
    rockets = rockets.filter(r => !r.dead);
    for (const s of sparks) {
      s.x += s.vx; s.y += s.vy; s.vy += 0.025; s.vx *= 0.985; s.vy *= 0.985; s.life -= 0.012;
      const c = rainbow ? `hsla(${s.hue},100%,60%,${s.life})` : color;
      ctx.globalAlpha = rainbow ? 1 : Math.max(0, s.life);
      ctx.fillStyle = c;
      ctx.fillRect(s.x - 1, s.y - 1, 2.2, 2.2);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    sparks = sparks.filter(s => s.life > 0 && s.y < H + 5);
    requestAnimationFrame(frame);
  }
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  launch();
  requestAnimationFrame(frame);
</script>
