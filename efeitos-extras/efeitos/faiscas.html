<head>
  <title>Faíscas</title>
  <meta description="Faíscas sobem e se apagam sobre uma cor de fundo suave." />
  <meta publisher="Hydraflow" />
  <meta property="background" label="Fundo" type="color" default="#140028" />
  <meta property="spark" label="Faísca" type="color" default="#ffd166" />
  <meta property="amount" label="Quantidade" type="number" min="1" max="100" default="45" />
  <meta property="speed" label="Velocidade" type="number" min="1" max="100" default="40" />
</head>
<body style="margin:0;background:#000"><canvas id="exCanvas" width="320" height="200"></canvas></body>
<script>
  const ctx = document.getElementById("exCanvas").getContext("2d");
  let ps = [];
  function frame() {
    ctx.globalAlpha = 1; ctx.fillStyle = background; ctx.fillRect(0, 0, 320, 200);
    for (let i = 0; i < amount / 20; i++) if (Math.random() < 0.6) ps.push({ x: Math.random() * 320, y: 205, vx: (Math.random() - 0.5) * 0.6, vy: -(0.5 + Math.random()) , life: 1 });
    for (const p of ps) {
      p.x += p.vx * speed / 20; p.y += p.vy * speed / 20; p.life -= 0.006 * speed / 20;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = spark; ctx.fillRect(p.x - 2, p.y - 2, 5, 5);
    }
    ps = ps.filter(p => p.life > 0 && p.y > -10);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
