<head>
  <title>Aquarela</title>
  <meta description="Manchas suaves de tinta se espalham e se misturam devagar, como aquarela em papel molhado." />
  <meta publisher="Hydraflow" />
  <meta property="speed" label="Velocidade" type="number" min="1" max="100" default="30" />
  <meta property="spots" label="Manchas" type="number" min="2" max="12" default="6" />
  <meta property="saturation" label="Saturação" type="number" min="20" max="100" default="80" />
  <meta property="palette" label="Paleta" type="combobox" values="Arco-íris,Quente,Fria,Pastel" default="Arco-íris" />
</head>
<body style="margin:0;background:#000"><canvas id="exCanvas" width="320" height="200"></canvas></body>
<script>
  // 1.0.1: cada quadro é pintado do zero. Antes as manchas eram empilhadas quase transparentes sobre o quadro
  // anterior; o arredondamento das cores (8 bits) nunca limpava os rastros e deixava um pontilhado quadriculado.
  const ctx = document.getElementById("exCanvas").getContext("2d");
  const W = 320, H = 200;
  const RANGE = { "Arco-íris": [0, 360], "Quente": [-30, 60], "Fria": [160, 280], "Pastel": [0, 360] };
  let t = 0, last = 0, drops = [];
  function sync() {
    while (drops.length < spots) drops.push({ px: Math.random() * 6, py: Math.random() * 6, fx: 0.2 + Math.random() * 0.4, fy: 0.2 + Math.random() * 0.4, h: Math.random(), r: 70 + Math.random() * 60, b: Math.random() * 6 });
    drops.length = spots;
  }
  function frame(now) {
    sync();
    const dt = last ? Math.min(0.1, (now - last) / 1000) : 0; last = now;
    t += dt * speed / 50;
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#0a0a10";
    ctx.fillRect(0, 0, W, H);
    const [h0, h1] = RANGE[palette] || RANGE["Arco-íris"];
    const light = palette === "Pastel" ? 74 : 54;
    // "screen": onde duas manchas se encontram as tintas se somam suavemente, sem estourar
    ctx.globalCompositeOperation = "screen";
    for (const d of drops) {
      const x = W / 2 + Math.sin(t * d.fx * 4 + d.px) * W * 0.42;
      const y = H / 2 + Math.cos(t * d.fy * 4 + d.py) * H * 0.42;
      const r = d.r * (0.9 + 0.1 * Math.sin(t * 0.7 + d.b));           // a mancha "respira" de leve
      const hue = ((h0 + (h1 - h0) * ((d.h + t * 0.25) % 1)) + 360) % 360;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `hsla(${hue},${saturation}%,${light}%,0.85)`);
      g.addColorStop(0.45, `hsla(${hue},${saturation}%,${light - 6}%,0.55)`);
      g.addColorStop(0.8, `hsla(${hue},${saturation}%,${light - 14}%,0.18)`);
      g.addColorStop(1, `hsla(${hue},${saturation}%,${light - 14}%,0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
