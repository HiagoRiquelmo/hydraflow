<head>
  <title>Hiperespaço</title>
  <meta description="Estrelas se esticam a partir do centro, como um salto para a velocidade da luz." />
  <meta publisher="Hydraflow" />
  <meta property="star" label="Estrelas" type="color" default="#bfe9ff" />
  <meta property="tint" label="Brilho central" type="color" default="#3d5cff" />
  <meta property="amount" label="Quantidade" type="number" min="30" max="300" default="140" />
  <meta property="speed" label="Velocidade" type="number" min="1" max="100" default="50" />
</head>
<body style="margin:0;background:#000"><canvas id="exCanvas" width="320" height="200"></canvas></body>
<script>
  const ctx = document.getElementById("exCanvas").getContext("2d");
  const W = 320, H = 200, CX = W / 2, CY = H / 2;
  const S = [];
  const spawn = s => Object.assign(s, { x: (Math.random() - 0.5) * W, y: (Math.random() - 0.5) * H, z: 1 + Math.random() * 3 });
  function frame() {
    const v = speed / 50;
    while (S.length < amount) { const s = spawn({}); s.z = 0.1 + Math.random() * 4; S.push(s); }
    S.length = Math.min(S.length, amount);
    ctx.globalAlpha = 0.35; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
    const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, 90);
    g.addColorStop(0, tint); g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.globalAlpha = 0.25; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1; ctx.strokeStyle = star; ctx.lineCap = "round";
    for (const s of S) {
      const z0 = s.z;
      s.z -= 0.03 * v;
      if (s.z <= 0.05) { spawn(s); continue; }
      const x0 = CX + s.x / z0, y0 = CY + s.y / z0, x1 = CX + s.x / s.z, y1 = CY + s.y / s.z;
      if (x1 < -10 || x1 > W + 10 || y1 < -10 || y1 > H + 10) { spawn(s); continue; }
      ctx.lineWidth = Math.min(3, 1.2 / s.z + 0.3);
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
