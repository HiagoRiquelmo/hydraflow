<head>
  <title>Caleidoscópio</title>
  <meta description="Formas coloridas espelhadas em volta do centro, girando e mudando de cor sem parar." />
  <meta publisher="Hydraflow" />
  <meta property="slices" label="Espelhos" type="number" min="3" max="12" default="6" />
  <meta property="saturation" label="Saturação" type="number" min="0" max="100" default="95" />
  <meta property="speed" label="Velocidade" type="number" min="1" max="100" default="30" />
</head>
<body style="margin:0;background:#000"><canvas id="exCanvas" width="320" height="200"></canvas></body>
<script>
  const ctx = document.getElementById("exCanvas").getContext("2d");
  const W = 320, H = 200, CX = W / 2, CY = H / 2, R = 200;
  let t = 0;
  function frame() {
    t += speed / 3000;
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
    const n = Math.round(slices), step = Math.PI * 2 / n;
    ctx.save(); ctx.translate(CX, CY); ctx.rotate(t * 2);
    for (let i = 0; i < n; i++) {
      ctx.save();
      ctx.rotate(i * step);
      if (i % 2) ctx.scale(1, -1); // espelha uma fatia sim, outra não
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, -step / 2, step / 2); ctx.closePath(); ctx.clip();
      // conteúdo de cada fatia: três círculos que andam e trocam de cor
      for (let k = 0; k < 3; k++) {
        const d = 30 + 50 * (0.5 + 0.5 * Math.sin(t * (3 + k) + k * 2));
        const off = Math.sin(t * (2 + k) + k) * step * 0.4;
        const x = Math.cos(off) * d, y = Math.sin(off) * d;
        const hue = (t * 200 + k * 120 + d) % 360;
        const g = ctx.createRadialGradient(x, y, 0, x, y, 26 + k * 10);
        g.addColorStop(0, `hsla(${hue},${saturation}%,60%,1)`); g.addColorStop(1, `hsla(${hue},${saturation}%,50%,0)`);
        ctx.fillStyle = g; ctx.fillRect(x - 40, y - 40, 80, 80);
      }
      ctx.restore();
    }
    ctx.restore();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
