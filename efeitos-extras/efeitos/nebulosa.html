<head>
  <title>Nebulosa</title>
  <meta description="Nuvens de gás luminoso que se misturam e pulsam devagar entre duas cores, como uma nebulosa no espaço." />
  <meta publisher="Hydraflow" />
  <meta property="color1" label="Cor 1" type="color" default="#7a2cff" />
  <meta property="color2" label="Cor 2" type="color" default="#00e5ff" />
  <meta property="speed" label="Velocidade" type="number" min="1" max="100" default="30" />
  <meta property="glow" label="Brilho" type="number" min="10" max="100" default="70" />
</head>
<body style="margin:0;background:#000"><canvas id="exCanvas" width="320" height="200"></canvas></body>
<script>
  const ctx = document.getElementById("exCanvas").getContext("2d");
  // calcula numa grade pequena e amplia com suavização: nuvens macias e leve para a CPU
  const GW = 64, GH = 40;
  const small = document.createElement("canvas"); small.width = GW; small.height = GH;
  const sctx = small.getContext("2d");
  const img = sctx.createImageData(GW, GH);
  const blobs = Array.from({ length: 6 }, (_, i) => ({ px: Math.random() * 10, py: Math.random() * 10, fx: 0.3 + i * 0.11, fy: 0.25 + i * 0.09, r: 9 + i * 2 }));
  let t = 0;
  function rgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
  function frame() {
    t += speed / 2500;
    const a = rgb(color1), b = rgb(color2), k = glow / 100;
    const pos = blobs.map(o => [GW / 2 + Math.sin(t * o.fx + o.px) * GW * 0.42, GH / 2 + Math.cos(t * o.fy + o.py) * GH * 0.42, o.r]);
    let i = 0;
    for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
      let v = 0, w = 0;
      for (let n = 0; n < pos.length; n++) {
        const dx = x - pos[n][0], dy = y - pos[n][1];
        const f = pos[n][2] * pos[n][2] / (dx * dx + dy * dy + 1);
        v += f; if (n % 2) w += f;
      }
      const m = Math.min(1, v * 0.18) * k;     // densidade da nuvem
      const mix = v ? w / v : 0;                 // que cor domina aqui
      img.data[i++] = (a[0] + (b[0] - a[0]) * mix) * m;
      img.data[i++] = (a[1] + (b[1] - a[1]) * mix) * m;
      img.data[i++] = (a[2] + (b[2] - a[2]) * mix) * m;
      img.data[i++] = 255;
    }
    sctx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(small, 0, 0, 320, 200);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
