<head>
  <title>Plasma</title>
  <meta description="Campos de cor orgânicos que se misturam continuamente." />
  <meta publisher="Hydraflow" />
  <meta property="speed" label="Velocidade" type="number" min="1" max="100" default="30" />
  <meta property="scale" label="Escala" type="number" min="5" max="100" default="40" />
  <meta property="palette" label="Paleta" type="combobox" values="Arco-íris,Oceano,Fogo,Neon" default="Arco-íris" />
</head>
<body style="margin:0;background:#000">
  <canvas id="exCanvas" width="320" height="200"></canvas>
</body>
<script>
  const c = document.getElementById("exCanvas");
  const ctx = c.getContext("2d");
  const W = 80, H = 50; // calcula em baixa resolução e amplia
  const off = new OffscreenCanvas(W, H);
  const octx = off.getContext("2d");
  const img = octx.createImageData(W, H);
  const palettes = {
    "Arco-íris": v => hsl(v * 360, 1, 0.5),
    "Oceano": v => hsl(170 + v * 70, 1, 0.25 + v * 0.3),
    "Fogo": v => hsl(v * 50, 1, 0.2 + v * 0.4),
    "Neon": v => hsl(280 + v * 120, 1, 0.5)
  };
  function hsl(h, s, l) {
    h = ((h % 360) + 360) % 360 / 360;
    const q = l < 0.5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
    const f = t => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < 1 / 2 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
    return [f(h + 1 / 3) * 255, f(h) * 255, f(h - 1 / 3) * 255];
  }
  let t = 0;
  function frame() {
    t += speed / 1500;
    const k = 0.5 / (scale / 40) ;
    const pal = palettes[palette] || palettes["Arco-íris"];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const v = Math.sin(x * k * 0.25 + t) + Math.sin((y * k * 0.3) + t * 1.3) + Math.sin((x + y) * k * 0.15 + t * 0.7) + Math.sin(Math.hypot(x - W / 2, y - H / 2) * k * 0.3 - t);
      const [r, g, b] = pal((v + 4) / 8);
      const i = (y * W + x) * 4;
      img.data[i] = r; img.data[i + 1] = g; img.data[i + 2] = b; img.data[i + 3] = 255;
    }
    octx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(off, 0, 0, 320, 200);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
