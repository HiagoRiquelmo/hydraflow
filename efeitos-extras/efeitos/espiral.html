<head>
  <title>Espiral</title>
  <meta description="Uma espiral colorida girando a partir do centro do canvas." />
  <meta publisher="Hydraflow" />
  <meta property="speed" label="Velocidade" type="number" min="-100" max="100" default="35" />
  <meta property="arms" label="Braços" type="number" min="1" max="8" default="3" />
  <meta property="twist" label="Torção" type="number" min="0" max="100" default="50" />
  <meta property="saturation" label="Saturação" type="number" min="0" max="100" default="100" />
</head>
<body style="margin:0;background:#000"><canvas id="exCanvas" width="320" height="200"></canvas></body>
<script>
  const c = document.getElementById("exCanvas"), ctx = c.getContext("2d");
  const W = 80, H = 50, off = new OffscreenCanvas(W, H), o = off.getContext("2d"), img = o.createImageData(W, H);
  let t = 0;
  function frame() {
    t += speed / 1500;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const dx = (x - W / 2) / (W / 2), dy = (y - H / 2) / (H / 2) * 0.625;
      const a = Math.atan2(dy, dx), r = Math.hypot(dx, dy);
      const hue = ((a * arms / (Math.PI * 2) + r * twist / 25 - t) % 1 + 1) % 1;
      const [R, G, B] = hsl(hue, saturation / 100, 0.5);
      const i = (y * W + x) * 4; img.data[i] = R; img.data[i + 1] = G; img.data[i + 2] = B; img.data[i + 3] = 255;
    }
    o.putImageData(img, 0, 0); ctx.drawImage(off, 0, 0, 320, 200);
    requestAnimationFrame(frame);
  }
  function hsl(h, s, l) {
    const q = l < 0.5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
    const f = t => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < 1 / 2 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
    return [f(h + 1 / 3) * 255, f(h) * 255, f(h - 1 / 3) * 255];
  }
  requestAnimationFrame(frame);
</script>
