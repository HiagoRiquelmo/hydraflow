<head>
  <title>Aurora</title>
  <meta description="Cortinas de luz verdes e violetas ondulando como a aurora boreal." />
  <meta publisher="Hydraflow" />
  <meta property="speed" label="Velocidade" type="number" min="1" max="100" default="30" />
  <meta property="colorA" label="Cor principal" type="color" default="#19ff9c" />
  <meta property="colorB" label="Cor secundária" type="color" default="#8a2be2" />
  <meta property="sky" label="Céu" type="color" default="#020314" />
</head>
<body style="margin:0;background:#000"><canvas id="exCanvas" width="320" height="200"></canvas></body>
<script>
  const ctx = document.getElementById("exCanvas").getContext("2d");
  let t = 0;
  function band(color, phase, amp, yBase, alpha) {
    ctx.globalAlpha = alpha;
    for (let x = 0; x < 320; x += 4) {
      const y = yBase + Math.sin(x / 40 + t * 1.3 + phase) * amp + Math.sin(x / 17 - t + phase) * amp * 0.4;
      const g = ctx.createLinearGradient(0, y - 60, 0, y + 20);
      g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(0.7, color); g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g; ctx.fillRect(x, y - 60, 5, 80);
    }
  }
  function frame() {
    t += speed / 2500;
    ctx.globalAlpha = 1; ctx.fillStyle = sky; ctx.fillRect(0, 0, 320, 200);
    band(colorB, 2, 22, 80, 0.55);
    band(colorA, 0, 28, 120, 0.75);
    band(colorA, 4, 16, 160, 0.35);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
